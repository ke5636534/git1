<div class="cap"><span class="no">图 5-1</span><b>贪心聚类的规则只有一句话：按顺序取一个还没被归簇的点当簇心，把它半径 ρ 内的所有点都划给它，然后继续。</b>所以 ρ 直接决定了“一颗粒子算几个簇”。<b>注意图中的圈会重叠</b>——这不是 bug：贪心算法里后选的簇心只吸收“还没被前面抢走”的点，两个圈重叠的部分早就归先来的那个了。真实实现用的是 3D 欧氏距离（<code>cluster.py</code> 的 <code>np.linalg.norm(pts - seed, axis=1) &lt;= R</code>），本图为了看清才投到 2D。图上数字是本机按同一套贪心规则跑出来的，不是示意值。</div>
