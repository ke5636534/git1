<div class="cap"><span class="no">图 8-1</span><b>这张图要纠正一个最常见的误读：κ 和 ν 不是"两种降载率"，是两种完全不同的"扔谁"的规则。</b>κ 只管<b>扔多少</b>（每个点独立掷骰子，与它长什么样无关）；ν 只管<b>扔谁</b>（按局部密度打分，不达标的整条丢）。所以论文 §6.4 把它们分别对应到两个目标：<b>κ 压延迟</b>（Fig.11）、<b>ν 减噪声匹配</b>（Fig.12），而不是"谁的精度更高"。严格说 ν 的分数是 <code>quality_scores</code> 算的"半径 2 cm 内邻居数"，不是图上手绘的簇形状——但"孤立点分数低"这个结论是一致的。</div>
